name: Release

on:
  push:
    tags:
      - '*'
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ServiceBusSearch.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true --output ./publish

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
